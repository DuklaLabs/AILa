<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>DuklaLabs Projekty</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #f4f5f7; color: #1a1a1a; }
    .card { background: #fff; border-radius: 14px; padding: 28px; width: 380px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center; }
    .pill { display: inline-grid; place-items: center; width: 44px; height: 44px;
            border-radius: 12px; background: #1a4fd6; color: #fff; font-weight: 700; }
    h1 { font-size: 20px; margin: 14px 0 4px; }
    .sub { color: #667085; font-size: 13px; margin: 0 0 18px; }
    a.btn { display: block; padding: 10px; border-radius: 8px; text-decoration: none;
            font-weight: 600; margin-top: 8px; }
    .primary { background: #1a4fd6; color: #fff; }
    .ghost { background: #eef1f6; color: #1a1a1a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="pill">DL</div>
    <h1>Projektový systém</h1>
    <p class="sub">Řízení prototypových projektů DuklaLabs</p>
    <a class="btn primary" href="/app/projects/">Otevřít aplikaci</a>
    <a class="btn ghost" href="/login">Přihlášení</a>
  </div>
</body>
</html>
