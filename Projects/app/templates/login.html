<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Přihlášení – DuklaLabs Projekty</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ BASE }}/static/css/theme.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/ui.css">
  <script src="{{ BASE }}/static/js/theme-toggle.js"></script>
  <link rel="stylesheet" href="{{ BASE }}/static/css/base.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/layout.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <div class="logo" role="img" aria-label="Logo DuklaLabs"><svg viewBox="0 0 192 192" aria-hidden="true"><defs><mask id="logoMask"><rect width="192" height="192" fill="#fff"/><polygon points="24,0 69,0 40,74 76,74 14,188 27,110 4,110" fill="#000" stroke="#000" stroke-width="18"/><circle cx="95" cy="96" r="38" fill="#000"/></mask></defs><g mask="url(#logoMask)"><path class="gear" d="M164.2 76.2 L186.6 79.9 L186.6 112.1 L164.2 115.8 L163.2 119 L162.1 122 L160.9 125.1 L159.5 128 L158 130.9 L171.2 149.3 L148.3 172.2 L129.9 159 L127 160.5 L124.1 161.9 L121 163.1 L118 164.2 L114.8 165.2 L111.1 187.6 L78.9 187.6 L75.2 165.2 L72 164.2 L69 163.1 L65.9 161.9 L63 160.5 L60.1 159 L41.7 172.2 L18.8 149.3 L32 130.9 L30.5 128 L29.1 125.1 L27.9 122 L26.8 119 L25.8 115.8 L3.4 112.1 L3.4 79.9 L25.8 76.2 L26.8 73 L27.9 70 L29.1 66.9 L30.5 64 L32 61.1 L18.8 42.7 L41.7 19.8 L60.1 33 L63 31.5 L65.9 30.1 L69 28.9 L72 27.8 L75.2 26.8 L78.9 4.4 L111.1 4.4 L114.8 26.8 L118 27.8 L121 28.9 L124.1 30.1 L127 31.5 L129.9 33 L148.3 19.8 L171.2 42.7 L158 61.1 L159.5 64 L160.9 66.9 L162.1 70 L163.2 73Z"/></g><polygon class="bolt" points="24,0 69,0 40,74 76,74 14,188 27,110 4,110"/></svg></div>
        <div>
          <h1>Projektový <span>systém</span></h1>
          <p>Přihlas se jménem a heslem</p>
        </div>
      </div>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div class="card narrow">
        <h2>Přihlášení</h2>
        {% if error %}
          <div class="err-note" role="alert">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ BASE }}/login-check">
          <label class="f" for="username">Uživatel
            <input id="username" name="username" type="text" autocomplete="username" required />
          </label>
          <label class="f" for="password">Heslo
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="btn primary block">Pokračovat</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
