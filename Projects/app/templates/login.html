<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Přihlášení – DuklaLabs Projekty</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ BASE }}/static/css/theme.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/ui.css">
  <script src="{{ BASE }}/static/js/theme-toggle.js"></script>
  <link rel="stylesheet" href="{{ BASE }}/static/css/base.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/layout.css">
</head>
<body>
  <div class="center-page">
    <div class="card narrow">
      <div class="logo-pill">DL</div>
      <h1>Projektový systém</h1>
      <p class="subtitle">Přihlas se jménem a heslem</p>

      {% if error %}
        <div class="err-note" role="alert">{{ error }}</div>
      {% endif %}

      <form method="POST" action="{{ BASE }}/login-check">
        <label class="f" for="username">Uživatel
          <input id="username" name="username" type="text" autocomplete="username" required />
        </label>
        <label class="f" for="password">Heslo
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn primary block">Pokračovat</button>
      </form>
    </div>
  </div>
</body>
</html>
