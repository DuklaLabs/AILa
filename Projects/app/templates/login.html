<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Přihlášení – DuklaLabs Projekty</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #f4f5f7; color: #1a1a1a; }
    .card { background: #fff; border-radius: 14px; padding: 28px; width: 340px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: center; }
    .pill { display: inline-grid; place-items: center; width: 44px; height: 44px;
            border-radius: 12px; background: #1a4fd6; color: #fff; font-weight: 700; }
    h1 { font-size: 20px; margin: 14px 0 4px; }
    .sub { color: #667085; font-size: 13px; margin: 0 0 16px; }
    form { text-align: left; display: grid; gap: 6px; }
    label { font-size: 12px; color: #667085; margin-top: 6px; }
    input { padding: 9px 10px; border: 1px solid #d0d5dd; border-radius: 8px; font: inherit; }
    button { margin-top: 14px; padding: 10px; border: 0; border-radius: 8px;
             background: #1a4fd6; color: #fff; font-weight: 600; cursor: pointer; }
    .err { color: #b42318; font-size: 13px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="pill">DL</div>
    <h1>Projektový systém</h1>
    <p class="sub">Přihlas se jménem a heslem</p>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <form method="POST" action="/login-check">
      <label for="username">Uživatel</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
      <label for="password">Heslo</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button type="submit">Pokračovat</button>
    </form>
  </div>
</body>
</html>
