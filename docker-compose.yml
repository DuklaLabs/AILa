services:
  postgres:
    image: postgres:16
    container_name: agent_postgres
    restart: always
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: agentdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - agentnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-migrate:
    build:
      context: ./Database
      dockerfile: Dockerfile.migrate
    container_name: agent_db_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: agentdb
      # Bootstrap admin (username password). Remove/blank to skip seeding.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    networks:
      - agentnet

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    networks:
      - agentnet

  # Multi-provider AI router (OmniRoute) — OpenAI-compatible endpoint in
  # front of many cloud/subscription/free providers, for requests that
  # ailacore.llm.complete(..., sensitive=False) doesn't send to the local
  # `ollama` above. Providers/models/API keys for callers are configured
  # through its own dashboard (http://localhost:20128), not env vars — see
  # Shared/README.md. Port published on all interfaces (not just
  # 127.0.0.1), so it's reachable from other machines on the network too.
  # NOTE: as of 2026-11, actually deployed via a standalone `docker run`
  # (container name `omniroute`) rather than `docker compose up` — this
  # block exists so the compose definition doesn't drift from what's
  # really running; bringing the stack up with compose should find the
  # existing container's config already matching.
  router:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "20128:20128"
    volumes:
      - omniroute-data:/app/data
    networks:
      - agentnet

  ollama-pull-models:
    image: ollama/ollama:latest
    container_name: ollama_pull_models
    volumes:
      - ollama-data:/root/.ollama
    # Zde definujete, které modely se mají stáhnout (oddělené mezerou)
    entrypoint: /bin/sh -c "ollama serve & sleep 5 && ollama pull qwen2.5"
    depends_on:
      - ollama

  access-request-server:
    build:
      context: .
      dockerfile: AccessRequest/Dockerfile
    container_name: AccessRequestServer
    ports:
      - "8003:8003"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      messenger:
        condition: service_started
    # lets DUKLA_PG_HOST=host.docker.internal reach a DB on the Docker host
    # (works out of the box on Docker Desktop; this line is for Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_HOST: postgres
      # Informování dozora e-mailem při zápisu studenta na otevřenou hodinu.
      # Odesílá přes službu Messenger; SUPERVISOR_EMAILS mapuje jména z
      # DUKLA_SUPERVISORS na adresy (oddělovač ";", volitelně víc řádků).
      MESSENGER_URL: http://messenger:8005
      SUPERVISOR_EMAILS: "Bc. Jan Petrášek=petrasek@spssecb.cz"
      # Vlastní cesta pod Gateway (viz Gateway/Caddyfile) – služba mountuje
      # statiku/šablony/routery pod tímhle prefixem místo na kořeni domény.
      URL_PREFIX: "/access"
      # Ovládání agentní vrstvy z admin panelu (karta „Běhy a spouštění agentů“).
      # ACCESS_AGENT_RUN_TOKEN musí být STEJNÝ jako u služby access-agents.
      # V produkci silná náhodná hodnota z prostředí, necommitovat.
      ACCESS_AGENTS_URL: http://access-agents:8007
      ACCESS_AGENT_RUN_TOKEN: "dev-run-token"
      # Veřejná URL serveru — odkazy v e-mailu (rozhodovací stránka) z ní
      # vycházejí, včetně URL_PREFIX výše. V produkci nastavit na skutečnou
      # (https) adresu, např. "https://labs.spssecb.cz/access".
      PUBLIC_BASE_URL: "http://localhost/access"
      # Podpis rozhodovacích odkazů. V produkci nastavit na náhodnou hodnotu;
      # její změna zneplatní všechny dříve rozeslané odkazy.
      DECISION_SECRET: "dev-decision-secret-zmen-v-produkci"
      # E-mail běžného učitele: primárně z public.teachers.email v duklamaps,
      # jinak odvození příjmení@TEACHER_EMAIL_DOMAIN. Výjimky:
      # TEACHER_EMAIL_OVERRIDES="Příjmení Jméno=mail; ..."
      TEACHER_EMAIL_DOMAIN: "spssecb.cz"
      # Třídní učitel se řídí výhradně sloupcem třídnictví v public.teachers
      # (jméno sloupce TEACHER_HOMEROOM_COLUMN). CLASS_TEACHERS je prázdné =
      # žádná ruční přepisová mapa. Bez třídního zůstává uvolňování blokované.
      CLASS_TEACHERS: ""
      TEACHER_HOMEROOM_COLUMN: "homeroom_class"
      # Koordinátor uvolňování; prázdné = adresy z SUPERVISOR_EMAILS.
      RELEASE_COORDINATOR_EMAILS: ""
      # Plánované rozesílání (APScheduler, in-process).
      SCHEDULER_ENABLED: "true"
      SCHEDULER_TZ: "Europe/Prague"
      TEACHER_DIGEST_DOW: "thu"        # rozhodovací digest učitelům
      TEACHER_DIGEST_HOUR: "13"
      SUPERVISOR_ROSTER_HOUR: "7"      # denní seznam uvolněných dozorům
      SUPERVISOR_ROSTER_MINUTE: "0"
      # BOOKING_NOTIFY_CC: "koordinator@spssecb.cz"   # nepovinná kopie
      # NOTIFY_ON_BOOKING: "true"    # i okamžitý e-mail při každém zápisu
      # NOTIFY_ENABLED: "false"      # úplně vypnout odchozí e-maily
      # Separate read-only "duklamaps" timetable DB used by the admin
      # open-hours grid to show supervising teachers' lessons. Leave
      # DUKLA_PG_HOST empty to disable (grid still works without it).
      # NOTE: inside the container "localhost" is the container itself —
      # use host.docker.internal for a DB running on your machine.
      DUKLA_PG_HOST: "host.docker.internal"
      DUKLA_PG_PORT: "5433"
      DUKLA_PG_DB: "duklamaps"
      DUKLA_PG_USER: "duklamaps"
      DUKLA_PG_PASSWORD: "duklamaps"
      # Čárkou oddělená jména dozorů. Matchuje se po slovech bez ohledu na
      # pořadí a tituly, takže "Bc. Jan Petrášek" sedne i na tvar
      # "Petrášek Jan" v rozvrhu (viz .../supervisions/debug).
      DUKLA_SUPERVISORS: "Bc. Jan Petrášek, Václav Hlaváč"          # "Novák Petr,Svoboda Jan"
      DUKLA_DAY_BASE: "0"                            # day_index pondělí (0 nebo 1)
      # "Tento týden" čte jen timetable_actual pro daný týden (week_date).
      # Když je prázdný (prázdniny), mřížka je bez rozvrhu. Nastav na "1"
      # jen pokud chceš v takovém případě spadnout na stálý rozvrh.
      DUKLA_PERMANENT_FALLBACK: "0"
      # Read-only lookup into the separate DuklaMaps project's DB (its own
      # docker-compose, not part of this stack) for the school timetable —
      # DuklaMaps already syncs it from Bakalari, see app/timetable_client.py.
      TIMETABLE_DB_HOST: host.docker.internal
      TIMETABLE_DB_PORT: 5433
      TIMETABLE_DB_NAME: duklamaps
      TIMETABLE_DB_USER: access_request_ro
      TIMETABLE_DB_PASSWORD: tnJ9vzSoKlQITayjdkZXiREF8CLxsX4F
    # SMTP + PUBLIC_BASE_URL for the excuse-request weekly digest — see
    # AccessRequest/.env.example. Own credentials, not shared with
    # security-agent's mailbox below.
    env_file:
      - ./AccessRequest/.env

  messenger:
    build:
      context: ./Messenger
      dockerfile: Dockerfile
    container_name: messenger
    ports:
      - "8005:8005"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      # Log odeslané pošty do messaging.mail_log v agentdb.
      POSTGRES_HOST: postgres
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
    env_file:
      - ./Messenger/.env

  security-agent:
    build:
      context: ./Security_agent
      dockerfile: Dockerfile
    container_name: security-agent
    ports:
      - "8004:8004"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
      messenger:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: agentdb
      OLLAMA_HOST: http://lmstudio:1234
      MESSENGER_URL: http://messenger:8005
    env_file:
      - ./Security_agent/.env

  projects-server:
    build:
      context: .
      dockerfile: Projects/Dockerfile
    container_name: projects-server
    ports:
      - "8006:8006"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    # lets OBSIDIAN_BASE_URL=host.docker.internal reach Obsidian's Local REST
    # API plugin running on the Docker host (works out of the box on Docker
    # Desktop; this line is for Linux — same pattern as access-request-server).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_HOST: postgres
      # Veřejná URL serveru (odkazy v UI/e-mailech), včetně URL_PREFIX níže.
      # V produkci https adresa, např. "https://labs.spssecb.cz/projects".
      PUBLIC_BASE_URL: "http://localhost/projects"
      # Vlastní cesta pod Gateway (viz Gateway/Caddyfile) – služba mountuje
      # statiku/šablony/routery/SPA pod tímhle prefixem místo na kořeni domény.
      URL_PREFIX: "/projects"
      # Interní hodinová sazba a týdenní kapacita člověka pro finanční/kapacitní
      # výpočty. Přednost má řádek v projects.settings, pak tyhle env, pak default.
      PROJECTS_HOURLY_RATE_CZK: "500"
      PROJECTS_WEEKLY_CAPACITY_HOURS: "40"
      # MCP server (napojení AI) na /mcp téhož portu 8006. "false" ho vypne.
      MCP_ENABLED: "true"
      # ailacore.obsidian (paměť agentů) — Obsidian běží na hostitelském
      # stroji, ne v kontejneru, proto host.docker.internal místo 127.0.0.1.
      # OBSIDIAN_API_KEY viz Projects/.env.example.
      OBSIDIAN_BASE_URL: "https://host.docker.internal:27124"
      # ailacore.llm — OmniRoute neběží jako služba v tomto compose souboru,
      # ale jako samostatný kontejner (viz `docker ps`, image
      # diegosouzapw/omniroute, port 20128 publikovaný na hosta) spravovaný
      # mimo tento stack. Proto host.docker.internal místo service name "router".
      # ROUTER_API_KEY/ROUTER_MODEL jsou v Projects/.env (secrets, gitignored).
      ROUTER_URL: "http://host.docker.internal:20128/v1"
      # Bez GPU na tomhle stroji nejede lokální Ollama — dokud nebude, i
      # "citlivá" větev (Pocket extrakce z přepisů schůzek) jede přes
      # OmniRoute místo lokálního modelu (viz Shared/ailacore/llm.py docstring
      # k LLM_SENSITIVE_BACKEND). Vypnout zpět na "ollama" (nebo smazat), až
      # bude lokální inference zase k dispozici.
      LLM_SENSITIVE_BACKEND: "router"
      # Alternativa k LLM_SENSITIVE_BACKEND=router výše: pokud je v síti
      # dostupná Ollama na jiném stroji (IP:port, typicky stroj s GPU),
      # nastav sem jeho adresu, vrať LLM_SENSITIVE_BACKEND na "ollama" (nebo
      # smaž) a citlivá data zůstanou na naší síti místo cloudu. Zkouší se
      # jen když OLLAMA_URL (service `ollama`) neodpoví na síťové úrovni.
      # OLLAMA_FALLBACK_URL: "http://192.168.1.50:11434"
    env_file:
      - ./Projects/.env

  # Agentní vrstva nad AccessRequest (§21 databanky). Vlastní plánovač +
  # ruční POST /run/{agent}. Čte agentdb přes ailacore, e-maily přes Messenger,
  # LLM přes Ollamu. Návrhy/reporty píše do sdíleného schématu `agent`;
  # schvalují se v access-request-server (admin panel).
  access-agents:
    build:
      context: .
      dockerfile: AccessAgents/Dockerfile
    container_name: access-agents
    ports:
      - "8007:8007"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
      messenger:
        condition: service_started
      access-request-server:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_HOST: postgres
      MESSENGER_URL: http://messenger:8005
      PUBLIC_BASE_URL: "http://localhost/access"
      OLLAMA_HOST: http://ollama:11434
      AILA_AGENT_MODEL: "qwen2.5:latest"
      # BEZPEČNÁ BRZDA: "false" = plánovač nezaregistruje žádný job.
      # Agenti jdou pořád spustit ručně přes POST /run/{agent}. Zapínat
      # postupně, agent po agentovi.
      ACCESS_AGENT_ENABLED: "false"
      SCHEDULER_TZ: "Europe/Prague"
      # #1 měsíční report o využívání laborky
      MONTHLY_REPORT_DAY: "1"
      MONTHLY_REPORT_HOUR: "6"
      # #2 hlídač uvolněných hodin podle předmětu (práh streaku)
      SUBJECT_RELEASE_STREAK: "3"
      # sdílený tajný token pro POST /run/{agent} bez session (skripty/testy
      # i proxy z admin panelu). STEJNÁ hodnota jako u access-request-server.
      ACCESS_AGENT_RUN_TOKEN: "dev-run-token"
      # adresář koordinátorů (jinak hodnoty ze SUPERVISOR_EMAILS)
      RELEASE_COORDINATOR_EMAILS: ""
      SUPERVISOR_EMAILS: "Bc. Jan Petrášek=petrasek@spssecb.cz"
      # duklamaps rozvrh (předmět k hodině, poptávka) – stejné jako u AccessRequest
      DUKLA_PG_HOST: "host.docker.internal"
      DUKLA_PG_PORT: "5433"
      DUKLA_PG_DB: "duklamaps"
      DUKLA_PG_USER: "duklamaps"
      DUKLA_PG_PASSWORD: "duklamaps"
      DUKLA_SUPERVISORS: "Bc. Jan Petrášek, Václav Hlaváč"
      DUKLA_DAY_BASE: "0"
      DUKLA_PERMANENT_FALLBACK: "0"
      # ailacore.llm / decide() — stejný důvod a stejná výhrada jako u
      # projects-server výše: bez GPU tu neběží lokální Ollama, takže i
      # agentí rozhodování (release_advisor, registration_triage, ...),
      # které pracuje s reálnými jmény studentů, dočasně jede přes OmniRoute
      # místo lokálního modelu. ROUTER_API_KEY/ROUTER_MODEL viz AccessAgents/.env.
      ROUTER_URL: "http://host.docker.internal:20128/v1"
      LLM_SENSITIVE_BACKEND: "router"
      # Stejná alternativa jako u projects-server výše — druhá Ollama v síti
      # po IP:port, zkoušená jen když service `ollama` neodpoví na síťové
      # úrovni (viz Shared/ailacore/llm.py).
      # OLLAMA_FALLBACK_URL: "http://192.168.1.50:11434"
    env_file:
      - ./AccessAgents/.env

  # "Generál" – volná konverzace + akce: sklad/objednávky přes Skladník/
  # Nakupcik (ani jedno zatím samo o sobě neběží, viz jejich README, ani
  # není v tomto compose souboru – CHECK_STOCK/CREATE_ORDER dnes spadnou na
  # chybu spojení) a e-mailová oznámení studentům přes Messenger (draft v
  # chatu -> potvrzení -> POST messenger:8005/send). Generál samotný ale
  # naběhne, jde promptovat a konverzace se ukládá pod účet
  # (general.chat_messages, viz Database/migrations).
  general:
    build:
      context: .
      dockerfile: General/Dockerfile
    container_name: general
    ports:
      - "8008:8008"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      messenger:
        condition: service_started
    # OmniRoute neběží jako služba v tomto compose souboru (viz projects-server
    # výše), proto host.docker.internal místo service name "router".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_HOST: postgres
      ROUTER_URL: "http://host.docker.internal:20128/v1"
      MESSENGER_URL: "http://messenger:8005"
      # Vlastní cesta pod Gateway (viz Gateway/Caddyfile).
      # Trasy Skladníka jsou pod prefixem /sklad (viz URL_PREFIX u skladnik).
      INVENTORY_URL: "http://skladnik:8001/sklad"
      URL_PREFIX: "/assistant"
    env_file:
      - ./General/.env

  # Kroužek — správa kroužku pro ZŠ/SŠ (žáci, docházka, projekty, kontakty),
  # port samostatného prototypu (statické HTML/JS) na flexibilní JSON
  # document store (schéma `club`, viz Database/migrations/0021_club.py).
  # Port 8009 — další volný po access-agents (8007) / general (8008).
  krouzek:
    build:
      context: .
      dockerfile: Krouzek/Dockerfile
    container_name: krouzek
    ports:
      - "8009:8009"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_HOST: postgres
      # Vlastní cesta pod Gateway (viz Gateway/Caddyfile).
      URL_PREFIX: "/krouzek"

  # Skladník – sklad/materiál (FastAPI). Vlastní cesta /sklad za Gateway
  # (viz Gateway/Caddyfile). Data skladu žijí ve vlastním SQLite souboru na
  # pojmenovaném volume, odděleně od sdíleného Postgresu – ten používá jen
  # pro SSO přihlášení přes ailacore.
  skladnik:
    build:
      context: .
      dockerfile: Skladník/Dockerfile
    container_name: skladnik
    ports:
      - "8001:8001"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_HOST: postgres
      URL_PREFIX: "/sklad"
      SKLADNIK_DB_PATH: "/app/data/procurement.db"
    volumes:
      - skladnik_data:/app/data

  # Reverse proxy (Caddy) sjednocující přístup pod jednu doménu a port:
  # portálový shell na kořeni localhost, jednotlivé služby jako podcesty
  # (localhost/access, localhost/projects, ...). Viz Gateway/Caddyfile.
  # Všechno běží na jednom originu, takže přihlášení (cookie dl_session) je
  # sdílené napříč službami bez dalšího nastavení (SSO).
  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: aila-gateway
    ports:
      - "80:80"
    networks:
      - agentnet
    depends_on:
      access-request-server:
        condition: service_started
      projects-server:
        condition: service_started
      general:
        condition: service_started
      krouzek:
        condition: service_started
      skladnik:
        condition: service_started
    volumes:
      - caddy_data:/data
      - caddy_config:/config

networks:
  agentnet:

volumes:
  postgres_data:
  ollama-data:
  omniroute-data:
  caddy_data:
  caddy_config:
  skladnik_data:
