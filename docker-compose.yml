services:
  postgres:
    image: postgres:16
    container_name: agent_postgres
    restart: always
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: agentdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - agentnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-migrate:
    build:
      context: ./Database
      dockerfile: Dockerfile.migrate
    container_name: agent_db_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: agentdb
      # Bootstrap admin (username password). Remove/blank to skip seeding.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin
    networks:
      - agentnet

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia
    networks:
      - agentnet



  access-request-server:
    build:
      context: .
      dockerfile: AccessRequest/Dockerfile
    container_name: AccessRequestServer
    ports:
      - "8003:8003"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      messenger:
        condition: service_started
    # lets DUKLA_PG_HOST=host.docker.internal reach a DB on the Docker host
    # (works out of the box on Docker Desktop; this line is for Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_HOST: postgres
      # Informování dozora e-mailem při zápisu studenta na otevřenou hodinu.
      # Odesílá přes službu Messenger; SUPERVISOR_EMAILS mapuje jména z
      # DUKLA_SUPERVISORS na adresy (oddělovač ";", volitelně víc řádků).
      MESSENGER_URL: http://messenger:8005
      SUPERVISOR_EMAILS: "Bc. Jan Petrášek=petrasek@spssecb.cz"
      # Veřejná URL serveru — odkazy v e-mailu (rozhodovací stránka) z ní
      # vycházejí. V produkci nastavit na skutečnou (https) adresu.
      PUBLIC_BASE_URL: "http://localhost:8003"
      # Podpis rozhodovacích odkazů. V produkci nastavit na náhodnou hodnotu;
      # její změna zneplatní všechny dříve rozeslané odkazy.
      DECISION_SECRET: "dev-decision-secret-zmen-v-produkci"
      # E-mail běžného učitele: primárně z public.teachers.email v duklamaps,
      # jinak odvození příjmení@TEACHER_EMAIL_DOMAIN. Výjimky:
      # TEACHER_EMAIL_OVERRIDES="Příjmení Jméno=mail; ..."
      TEACHER_EMAIL_DOMAIN: "spssecb.cz"
      # Třídní učitel se řídí výhradně sloupcem třídnictví v public.teachers
      # (jméno sloupce TEACHER_HOMEROOM_COLUMN). CLASS_TEACHERS je prázdné =
      # žádná ruční přepisová mapa. Bez třídního zůstává uvolňování blokované.
      CLASS_TEACHERS: ""
      TEACHER_HOMEROOM_COLUMN: "homeroom_class"
      # Koordinátor uvolňování; prázdné = adresy z SUPERVISOR_EMAILS.
      RELEASE_COORDINATOR_EMAILS: ""
      # Plánované rozesílání (APScheduler, in-process).
      SCHEDULER_ENABLED: "true"
      SCHEDULER_TZ: "Europe/Prague"
      TEACHER_DIGEST_DOW: "thu"        # rozhodovací digest učitelům
      TEACHER_DIGEST_HOUR: "13"
      SUPERVISOR_ROSTER_HOUR: "7"      # denní seznam uvolněných dozorům
      SUPERVISOR_ROSTER_MINUTE: "0"
      # BOOKING_NOTIFY_CC: "koordinator@spssecb.cz"   # nepovinná kopie
      # NOTIFY_ON_BOOKING: "true"    # i okamžitý e-mail při každém zápisu
      # NOTIFY_ENABLED: "false"      # úplně vypnout odchozí e-maily
      # Separate read-only "duklamaps" timetable DB used by the admin
      # open-hours grid to show supervising teachers' lessons. Leave
      # DUKLA_PG_HOST empty to disable (grid still works without it).
      # NOTE: inside the container "localhost" is the container itself —
      # use host.docker.internal for a DB running on your machine.
      DUKLA_PG_HOST: "host.docker.internal"
      DUKLA_PG_PORT: "5433"
      DUKLA_PG_DB: "duklamaps"
      DUKLA_PG_USER: "duklamaps"
      DUKLA_PG_PASSWORD: "duklamaps"
      # Čárkou oddělená jména dozorů. Matchuje se po slovech bez ohledu na
      # pořadí a tituly, takže "Bc. Jan Petrášek" sedne i na tvar
      # "Petrášek Jan" v rozvrhu (viz .../supervisions/debug).
      DUKLA_SUPERVISORS: "Bc. Jan Petrášek, Václav Hlaváč"          # "Novák Petr,Svoboda Jan"
      DUKLA_DAY_BASE: "0"                            # day_index pondělí (0 nebo 1)
      # "Tento týden" čte jen timetable_actual pro daný týden (week_date).
      # Když je prázdný (prázdniny), mřížka je bez rozvrhu. Nastav na "1"
      # jen pokud chceš v takovém případě spadnout na stálý rozvrh.
      DUKLA_PERMANENT_FALLBACK: "0"

  messenger:
    build:
      context: ./Messenger
      dockerfile: Dockerfile
    container_name: messenger
    ports:
      - "8005:8005"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      # Log odeslané pošty do messaging.mail_log v agentdb.
      POSTGRES_HOST: postgres
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
    env_file:
      - ./Messenger/.env

  security-agent:
    build:
      context: ./Security_agent
      dockerfile: Dockerfile
    container_name: security-agent
    ports:
      - "8004:8004"
    networks:
      - agentnet
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      ollama:
        condition: service_started
      messenger:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: agentdb
      OLLAMA_HOST: http://lmstudio:1234
      MESSENGER_URL: http://messenger:8005
    env_file:
      - ./Security_agent/.env



networks:
  agentnet:

volumes:
  postgres_data:
  ollama-data:
