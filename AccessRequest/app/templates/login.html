<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <title>Přihlášení – DuklaLabs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ BASE }}/static/css/theme.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/ui.css">
  <script src="{{ BASE }}/static/js/theme-toggle.js"></script>
  <link rel="stylesheet" href="{{ BASE }}/static/css/base.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/forms.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/buttons.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/layout.css">
</head>
<body>

  <div class="center-page">
    <div class="panel" style="max-width:380px; text-align:center;">
      <div class="logo-pill">DL</div>
      <h1>Přihlášení</h1>
      <p class="subtitle">Přihlas se e-mailem a heslem (studenti i správci)</p>

      {% if error %}
        <div style="color:var(--a); margin-bottom:10px; font-size:13px;">
          {{ error }}
        </div>
      {% endif %}

      <form class="form-stack" method="POST" action="{{ BASE }}/login-check" style="text-align:left;">
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <label class="f">Uživatel
          <input id="username" name="username" type="text" required />
        </label>

        <label class="f">Heslo
          <input id="password" name="password" type="password" required />
        </label>

        <button type="submit" class="btn primary block">Pokračovat</button>
      </form>

      <p style="margin-top:10px; font-size:12px; color:var(--muted);">
        Nemáš účet? <a href="{{ BASE }}/student-register">Zaregistruj se</a>.
      </p>
    </div>
  </div>

</body>
</html>
