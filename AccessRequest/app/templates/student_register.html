{%- import "_shell.html" as shell -%}
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>DuklaLabs – Registrace studenta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ shell.assets() }}
  <link rel="stylesheet" href="{{ BASE }}/static/css/forms.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/buttons.css">
  <link rel="stylesheet" href="{{ BASE }}/static/css/layout.css">

  <script>window.BASE_PATH = "{{ BASE }}";</script>
  <script src="{{ BASE }}/static/js/validate.js" defer></script>
  <script src="{{ BASE }}/static/js/loader.js" defer></script>
</head>

<body>
{{ shell.header("Registrace studenta", "Zadej své údaje pro registraci do systému DuklaLabs.") }}

<main>
<div class="wrap">
<section class="view">
<div class="panel solo" style="max-width:420px;">

    {% if error %}
      <div style="color:var(--a); margin-bottom:10px; font-size:13px;">
        {{ error }}
      </div>
    {% endif %}

    <form id="studentForm" class="form-stack" method="POST" onsubmit="return validateStudentForm();">
      <label class="f">Jméno
        <input id="first_name" name="first_name" type="text" required />
      </label>

      <label class="f">Příjmení
        <input id="last_name" name="last_name" type="text" required />
      </label>

      <label class="f">Školní e-mail
        <input id="email" name="email" type="email" required />
      </label>

      <label class="f">Heslo
        <input id="password" name="password" type="password" minlength="8" required />
      </label>

      <label class="f">Třída
      <select id="class_group" name="class_group" required>
          <option value="">-- vyber třídu --</option>
          <option value="1.EM">1.EM</option>
          <option value="1.ER">1.ER</option>
          <option value="1.EE">1.EE</option>
          <option value="1.S">1.S</option>
          <option value="2.EM">2.EM</option>
          <option value="2.ER">2.ER</option>
          <option value="2.EE">2.EE</option>
          <option value="2.S">2.S</option>
          <option value="3.EM">3.EM</option>
          <option value="3.ER">3.ER</option>
          <option value="3.EE">3.EE</option>
          <option value="3.S">3.S</option>
          <option value="4.EM">4.EM</option>
          <option value="4.ER">4.ER</option>
          <option value="4.EE">4.EE</option>
          <option value="4.S">4.S</option>
      </select>
      </label>

      <button class="btn primary block">Odeslat registraci</button>
    </form>

    <div id="loader" class="loader hidden"></div>
  </div>
</section>
</div>
</main>
</body>
</html>
