<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <title>DuklaLabs – Admin panel</title>
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/buttons.css" />
    <link rel="stylesheet" href="/static/css/forms.css" />

    <!-- Specifický styl pro open hours -->
    <link rel="stylesheet" href="/static/css/open_hours.css" />
</head>

<body>

<header class="topbar">
    <h1>⚙️ Admin panel – Otevřené hodiny</h1>
</header>

<main class="container">

    <!-- ČEKAJÍCÍ REGISTRACE -->
    <section class="card" id="pendingCard" style="display:none;">
        <h2>🔔 Čekající registrace (<span id="pendingCount">0</span>)</h2>
        <div id="pendingList">Načítám...</div>
    </section>

    <!-- FORM -->
    <section class="card">
        <h2>Přidat otevřenou hodinu</h2>

        <form id="openHoursForm" class="form">

            <div class="form-group">
                <label for="date">Datum</label>
                <input id="date" name="date" type="date" required>
            </div>

            <div class="form-group">
                <label for="hour_number">Vyučovací hodina</label>
                <select id="hour_number" name="hour_number" required>
                    <option value="">-- vyber hodinu --</option>
                    <option value="0">0. hodina (7:10–7:55)</option>
                    <option value="1">1. hodina (8:00–8:45)</option>
                    <option value="2">2. hodina (8:50–9:35)</option>
                    <option value="3">3. hodina (9:55–10:40)</option>
                    <option value="4">4. hodina (10:45–11:30)</option>
                    <option value="5">5. hodina (11:40–12:25)</option>
                    <option value="6">6. hodina (12:30–13:15)</option>
                    <option value="7">7. hodina (13:20–14:05)</option>
                    <option value="8">8. hodina (14:10–14:55)</option>
                    <option value="9">9. hodina (15:00–15:45)</option>
                    <option value="10">10. hodina (15:50–16:35)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="capacity">Kapacita</label>
                <input id="capacity" name="capacity" type="number" min="1" required>
            </div>

            <div class="form-group">
                <label for="note">Poznámka</label>
                <input id="note" name="note" type="text">
            </div>

            <button class="btn-primary" type="submit">💾 Uložit</button>
        </form>

        <div id="formMessage" class="form-message"></div>
    </section>

    <!-- LIST -->
    <section class="card">
        <h2>Nastavené otevřené hodiny</h2>
        <div id="openHoursList">Načítám...</div>
    </section>

</main>

<script src="/static/js/timetable.js"></script>
<script src="/static/js/pending_students.js"></script>
<script src="/static/js/open_hours.js"></script>
</body>
</html>
