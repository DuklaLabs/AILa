<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8" />
    <title>DuklaLabs – Admin panel</title>
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/layout.css" />
    <link rel="stylesheet" href="/static/css/buttons.css" />
    <link rel="stylesheet" href="/static/css/forms.css" />

    <!-- Specifický styl pro open hours (?v = cache-buster při změnách) -->
    <link rel="stylesheet" href="/static/css/open_hours.css?v=14" />
</head>

<body>

<header class="topbar">
    <h1>⚙️ DuklaLabs – Otevřené hodiny</h1>
</header>

<main class="container">

    <!-- ČEKAJÍCÍ REGISTRACE -->
    <section class="card" id="pendingCard" style="display:none;">
        <h2>🔔 Čekající registrace (<span id="pendingCount">0</span>)</h2>
        <div id="pendingList">Načítám...</div>
    </section>

    <!-- TÝDENNÍ MŘÍŽKA -->
    <section class="card">
        <div class="card-head">
            <h2>Otevřené hodiny</h2>
            <div class="week-toggle">
                <button type="button" data-week="0" class="active">Tento týden</button>
                <button type="button" data-week="1">Příští týden</button>
            </div>
        </div>
        <p class="hint" id="gridHint"></p>
        <div id="supFilter" class="sup-filter"></div>
        <div id="weekGrid">Načítám...</div>
    </section>

</main>

<!-- Detail rezervací na jednu otevřenou hodinu (přehled „tento týden") -->
<div id="ohModal" class="oh-modal" style="display:none;" onclick="if(event.target===this)closeOhModal()">
    <div class="oh-modal-box">
        <button type="button" class="oh-modal-close" onclick="closeOhModal()">×</button>
        <div id="ohModalBody"></div>
    </div>
</div>

<div id="toastHost" class="toast-host"></div>

<!-- Celoobrazovkové okno pro chyby / potvrzení -->
<div id="appDialog" class="app-dialog" style="display:none;">
    <div class="app-dialog-box">
        <div class="app-dialog-title" id="appDialogTitle"></div>
        <div class="app-dialog-msg" id="appDialogMsg"></div>
        <div class="app-dialog-actions" id="appDialogActions"></div>
    </div>
</div>

<script src="/static/js/timetable.js?v=14"></script>
<script src="/static/js/pending_students.js"></script>
<script src="/static/js/open_hours.js?v=14"></script>
</body>
</html>
